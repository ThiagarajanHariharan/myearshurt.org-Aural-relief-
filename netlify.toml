[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/music/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[redirects]]
  from = "/portfolio"
  to = "/portfolio/index.html"
  status = 200

[[redirects]]
  from = "/portfolio/*"
  to = "/portfolio/:splat"
  status = 200

[[redirects]]
  from = "/heist"
  to = "/portfolio/heist.html"
  status = 200

[[redirects]]
  from = "/arcade"
  to = "/portfolio/contribution-blaster.html"
  status = 200
